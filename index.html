<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IMDF Viewer</title>
<meta name="description" content="Bekijk en valideer IMDF-indoorkaarten (Indoor Mapping Data Format, OGC 20-094) in de browser. De data blijft lokaal.">
<meta name="theme-color" content="#eef1f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c1016" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%234c5fd5'/%3E%3Cpath d='M6 7h5v4H6zm7 0h5v10h-5zM6 13h5v4H6z' fill='%23fff'/%3E%3C/svg%3E">
<!-- Content Security Policy: alleen scripts van deze site en de twee vaste CDN's; geen inline scripts,
     geen eval, geen plug-ins. Een script dat via IMDF-data in de pagina zou belanden, wordt geweigerd. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://unpkg.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://unpkg.com; img-src 'self' data: blob: https://service.pdok.nl; connect-src 'self' https://service.pdok.nl https://tiles.openfreemap.org; worker-src 'self' blob:; child-src 'self' blob:; font-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<script src="js/theme-early.js"></script>
<!-- Externe bronnen: vooraf verbinden; bibliotheken met integriteitscontrole (SRI) -->
<link rel="preconnect" href="https://service.pdok.nl" crossorigin>
<link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"
      integrity="sha384-MinO0mNliZ3vwppuPOUnGa+iq619pfMhLVUXfC4LHwSCvF9H+6P/KO4Q7qBOYV5V" crossorigin="anonymous">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<aside id="side">
  <header>
    <div class="titles">
      <h1 id="venue-name">IMDF Viewer</h1>
      <div id="venue-sub">Open een IMDF-archief (.zip) of de losse .geojson-bestanden</div>
    </div>
    <div class="controls">
    <select id="lang" class="hidden" title="Taal van namen" aria-label="Taal van namen"></select>
    <div id="theme" role="group" aria-label="Thema">
      <button data-pref="auto" title="Automatisch (systeem)" aria-label="Automatisch"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm0 2v16a8 8 0 0 1 0-16Z"/></svg></button>
      <button data-pref="light" title="Licht" aria-label="Licht"><svg viewBox="0 0 24 24"><path d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10ZM11 1h2v3h-2zm0 19h2v3h-2zM1 11h3v2H1zm19 0h3v2h-3zM4.22 5.64l1.42-1.42 2.12 2.12-1.42 1.42zm12.02 12.02 1.42-1.42 2.12 2.12-1.42 1.42zM4.22 18.36l2.12-2.12 1.42 1.42-2.12 2.12zM16.24 6.34l2.12-2.12 1.42 1.42-2.12 2.12z"/></svg></button>
      <button data-pref="dark" title="Donker" aria-label="Donker"><svg viewBox="0 0 24 24"><path d="M21 14.5A9 9 0 0 1 9.5 3a9 9 0 1 0 11.5 11.5Z"/></svg></button>
    </div>
    </div>
  </header>
  <div class="scroll">
    <div class="row" style="margin-top:8px">
      <button class="btn" id="open-btn">Ander bestand openen…</button>
      <button class="btn hidden" id="close-btn" title="Bestand sluiten en niet meer onthouden">Sluiten</button>
    </div>

    <details id="info" class="hidden" open>
      <summary><h2>Bestand</h2></summary>
      <div id="info-body"></div>
    </details>

    <h2>Zoeken</h2>
    <input type="search" id="search" placeholder="Zoek in alle objecten (naam, categorie, adres of id)…" autocomplete="off">
    <div id="results"></div>

    <h2>Lagen</h2>
    <label class="chk" data-feat="occupant"><input type="checkbox" data-layer="occupant" checked><span id="occupant-legend-icon"></span>Occupants<span class="cnt" id="cnt-occupant"></span></label>
    <label class="chk" data-feat="amenity"><input type="checkbox" data-layer="amenity" checked><span id="amenity-legend-icon"></span>Amenities<span class="cnt" id="cnt-amenity"></span></label>
    <label class="chk"><input type="checkbox" data-layer="labels" checked>Namen tonen</label>
    <label class="chk" data-feat="venue"><input type="checkbox" data-layer="venue" checked>Venue<span class="cnt" data-cnt="venue"></span></label>
    <label class="chk" data-feat="footprint"><input type="checkbox" data-layer="footprint" checked>Footprints<span class="cnt" data-cnt="footprint"></span></label>
    <label class="chk" data-feat="level"><input type="checkbox" data-layer="level" checked>Levels<span class="cnt" data-cnt="level"></span></label>
    <label class="chk" data-feat="unit"><input type="checkbox" data-layer="unit" checked>Units<span class="cnt" data-cnt="unit"></span></label>
    <label class="chk" data-feat="opening"><input type="checkbox" data-layer="opening" checked>Openings<span class="cnt" data-cnt="opening"></span></label>
    <label class="chk" data-feat="section"><input type="checkbox" data-layer="section" checked>Sections<span class="cnt" data-cnt="section"></span></label>
    <label class="chk" data-feat="fixture"><input type="checkbox" data-layer="fixture" checked>Fixtures<span class="cnt" data-cnt="fixture"></span></label>
    <label class="chk" data-feat="kiosk"><input type="checkbox" data-layer="kiosk" checked>Kiosks<span class="cnt" data-cnt="kiosk"></span></label>
    <label class="chk" data-feat="detail"><input type="checkbox" data-layer="detail" checked>Details<span class="cnt" data-cnt="detail"></span></label>
    <label class="chk"><input type="checkbox" data-layer="basemap" checked>Achtergrondkaart</label>

    <h2>Categorieën op deze verdieping</h2>
    <details class="cats" open><summary>Occupants</summary><div class="list" id="cats-occupant"></div></details>
    <details class="cats"><summary>Amenities</summary><div class="list" id="cats-amenity"></div></details>
  </div>
</aside>

<div id="mapwrap">
 <div id="mapbox">
  <div id="map"></div>
  <div id="levelname" class="hidden"></div>
  <div id="levels" class="hidden"></div>
  <div id="drop">
    <div class="box">
      <h1 style="margin:0;font-size:20px">IMDF-bestand openen</h1>
      <p>Sleep een IMDF .zip (of alle .geojson-bestanden) hierheen, of kies een bestand.</p>
      <button class="btn primary" id="pick-btn">Bestand kiezen…</button>
      <div id="status"></div>
    </div>
  </div>
 </div>
 <!-- Attributentabel -->
 <section id="tbl" class="hidden" aria-label="Attributentabel">
  <div id="tbl-grip" title="Sleep om de hoogte te wijzigen"></div>
  <div class="tbl-bar">
    <strong id="tbl-title"></strong>
    <span id="tbl-count" class="muted"></span>
    <input type="search" id="tbl-q" placeholder="Zoek in tabel…" autocomplete="off">
    <label class="chk tbl-opt"><input type="checkbox" id="tbl-level">Alleen deze verdieping</label>
    <span class="spacer"></span>
    <button class="btn sm" id="tbl-zoom" title="Zoom naar de geselecteerde regel" disabled>Zoom naar selectie</button>
    <button class="btn sm" id="tbl-desel" title="Selectie opheffen (Esc)" disabled>Selectie opheffen</button>
    <button class="btn sm" id="tbl-csv" title="Gefilterde regels als CSV downloaden">CSV</button>
    <button class="btn sm icon" id="tbl-close" title="Tabel sluiten" aria-label="Tabel sluiten">✕</button>
  </div>
  <div id="tbl-scroll"><table id="tbl-table"><colgroup></colgroup><thead></thead><tbody></tbody></table></div>
 </section>
</div>
<div id="ctx" class="hidden" role="menu"></div>
<div id="jsonpop" class="hidden"></div>
<input type="file" id="file" accept=".zip,.geojson,.json" multiple class="hidden">

<!-- Bibliotheken (vaste versies, met SRI) -->
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"
        integrity="sha384-SYKAG6cglRMN0RVvhNeBY0r3FYKNOJtznwA0v7B5Vp9tr31xAHsZC0DqkQ/pZDmj" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"
        integrity="sha384-+mbV2IY1Zk/X1p/nWllGySJSUN8uMs+gUAN10Or95UBH0fpj6GfKgPmgC5EXieXG" crossorigin="anonymous"></script>
<!-- Validator (regels + niet-geometrische controles; de volledige validatie draait in js/validator/worker.js) -->
<script src="js/validator/rules.js"></script>
<script src="js/validator/core.js"></script>
<!-- Viewer (gewone scripts, volgorde is van belang) -->
<script src="js/palette.js"></script>
<script src="js/icons.js"></script>
<script src="js/state.js"></script>
<script src="js/theme.js"></script>
<script src="js/map.js"></script>
<script src="js/data.js"></script>
<script src="js/info.js"></script>
<script src="js/validation.js"></script>
<script src="js/render.js"></script>
<script src="js/popups.js"></script>
<script src="js/table.js"></script>
<script src="js/app.js"></script>
</body>
</html>
