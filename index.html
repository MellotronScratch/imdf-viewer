<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IMDF Viewer</title>
<script>
  // Vroeg het thema zetten om een flits van het verkeerde thema te voorkomen
  (() => {
    let pref = "auto"; try { pref = localStorage.getItem("imdf-theme") || "auto"; } catch {}
    const dk = pref === "dark" || (pref === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.dataset.theme = dk ? "dark" : "light";
  })();
</script>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  /* Thema: data-theme ("light"/"dark") wordt door het script hieronder altijd gezet */
  :root {
    color-scheme: light;
    --bg: #eef1f5; --panel: #ffffff; --panel-2: #f6f8fa; --text: #161b26; --muted: #5d6879; --line: #e1e6ed;
    --accent: #4c5fd5; --accent-soft: #e8ebfb; --accent-text: #ffffff; --hover: #f1f3f7;
    --shadow: 0 1px 2px rgba(22,27,38,.06), 0 6px 20px rgba(22,27,38,.10);
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0c1016; --panel: #151a22; --panel-2: #1b212b; --text: #e7ebf2; --muted: #8c97a8; --line: #262e3a;
    --accent: #8d9bff; --accent-soft: #232a4a; --accent-text: #0c1016; --hover: #1f2631;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.45);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; display: flex; overflow: hidden; -webkit-font-smoothing: antialiased; }
  body, #side, .btn, #levels, #levelname, input { transition: background-color .2s, color .2s, border-color .2s; }
  #side { width: 320px; flex: none; background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; overflow: hidden; z-index: 2; }
  /* Titel over de volle breedte (mag afbreken); taal- en themaknoppen in een eigen rij eronder */
  #side header { padding: 16px 16px 12px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
  #side header .titles { min-width: 0; }
  #side header .controls { display: flex; gap: 8px; align-items: center; justify-content: flex-end; }
  #side h1 { font-size: 17px; margin: 0 0 2px; letter-spacing: -.01em; line-height: 1.25; overflow-wrap: anywhere; }
  #venue-sub { overflow-wrap: anywhere; }
  #theme { display: flex; background: var(--panel-2); border: 1px solid var(--line); border-radius: 9px; padding: 2px; flex: none; }
  #theme button { border: 0; background: transparent; color: var(--muted); width: 28px; height: 26px; border-radius: 7px; cursor: pointer; display: grid; place-items: center; padding: 0; }
  #theme button:hover { color: var(--text); }
  #theme button.on { background: var(--panel); color: var(--accent); box-shadow: 0 1px 3px rgba(0,0,0,.15); }
  #theme svg { width: 16px; height: 16px; fill: currentColor; }
  input[type=checkbox] { accent-color: var(--accent); }
  #lang { flex: none; margin-right: auto; height: 32px; padding: 0 6px; font-size: 12px; font-weight: 600; text-transform: uppercase; cursor: pointer; }
  select { font: inherit; color: var(--text); background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; }
  .maplibregl-ctrl-group { background: var(--panel) !important; box-shadow: var(--shadow) !important; border-radius: 10px !important; overflow: hidden; }
  .maplibregl-ctrl-group button + button { border-top-color: var(--line) !important; }
  .maplibregl-ctrl-group button:hover { background-color: var(--hover) !important; }
  :root[data-theme="dark"] .maplibregl-ctrl-group .maplibregl-ctrl-icon { filter: invert(1) brightness(1.4); }
  .maplibregl-ctrl-scale { background: color-mix(in srgb, var(--panel) 80%, transparent) !important; color: var(--text) !important; border-color: var(--muted) !important; }
  .maplibregl-ctrl-attrib { background: color-mix(in srgb, var(--panel) 80%, transparent) !important; color: var(--muted); }
  .maplibregl-ctrl-attrib a { color: var(--muted) !important; }
  :root[data-theme="dark"] .maplibregl-ctrl-attrib-button { filter: invert(1); }
  #venue-sub { color: var(--muted); font-size: 12px; }
  #side .scroll { overflow-y: auto; flex: 1; padding: 8px 16px 24px; }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 18px 0 6px; font-weight: 600; }
  .btn { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--text); padding: 7px 12px; border-radius: 8px; cursor: pointer; }
  .btn:hover { background: var(--hover); }
  .btn.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  input[type=search] { width: 100%; font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text); }
  label.chk { display: flex; align-items: center; gap: 8px; padding: 3px 0; cursor: pointer; }
  label.chk .cnt { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; }
  .dot { width: 11px; height: 11px; border-radius: 50%; flex: none; border: 1.5px solid var(--panel); box-shadow: 0 0 0 1px color-mix(in srgb, var(--text) 25%, transparent); }
  .dot.sq { border-radius: 3px; }
  details.cats > summary { cursor: pointer; padding: 4px 0; list-style: none; display: flex; align-items: center; gap: 8px; }
  details.cats > summary::before { content: "▸"; color: var(--muted); width: 10px; }
  details.cats[open] > summary::before { content: "▾"; }
  details.cats .list { padding-left: 18px; }
  #results { margin-top: 6px; max-height: 260px; overflow-y: auto; }
  #results div { padding: 6px 8px; border-radius: 6px; cursor: pointer; display: flex; gap: 8px; align-items: center; }
  #results div:hover { background: var(--hover); }
  #results small { color: var(--muted); margin-left: auto; white-space: nowrap; }
  #mapwrap { flex: 1; position: relative; min-width: 0; }
  #map { position: absolute; inset: 0; }
  #levels { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: var(--panel); border-radius: 12px; box-shadow: var(--shadow); display: flex; flex-direction: column; overflow: hidden; z-index: 3; }
  #levels button { font: 600 13px system-ui, sans-serif; border: 0; border-bottom: 1px solid var(--line); background: transparent; color: var(--text); min-width: 52px; padding: 10px 8px; cursor: pointer; }
  #levels button:last-child { border-bottom: 0; }
  #levels button:hover { background: var(--hover); }
  #levels button.on { background: var(--accent); color: var(--accent-text); }
  #levels button:focus-visible, .btn:focus-visible, #theme button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  input[type=search]:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  #levelname { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); background: var(--panel); padding: 6px 14px; border-radius: 999px; box-shadow: var(--shadow); font-weight: 600; z-index: 3; white-space: nowrap; }
  #drop { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent); }
  #drop .box { border: 2px dashed var(--line); border-radius: 16px; padding: 36px 40px; text-align: center; background: var(--panel); max-width: 440px; margin: 16px; }
  #drop.over .box { border-color: var(--accent); }
  #drop p { color: var(--muted); margin: 8px 0 18px; }
  #status { color: var(--muted); font-size: 12px; margin-top: 10px; min-height: 1em; }
  .hidden { display: none !important; }
  #info > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 6px; }
  #info > summary::-webkit-details-marker { display: none; }
  #info > summary h2 { margin-bottom: 6px; }
  #info > summary::after { content: "▾"; color: var(--muted); font-size: 11px; margin-top: 12px; }
  #info:not([open]) > summary::after { content: "▸"; }
  #info-body table { border-collapse: collapse; width: 100%; font-size: 13px; }
  #info-body td { padding: 2px 0; vertical-align: top; }
  #info-body td:first-child { color: var(--muted); padding-right: 10px; white-space: nowrap; width: 1%; }
  #info-body td:last-child { word-break: break-word; }
  #info-body a { color: var(--accent); }
  #info-body .sub { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin: 10px 0 3px; }
  #info-body .counts { display: grid; grid-template-columns: 1fr auto 1fr auto; gap: 1px 10px; font-size: 12px; }
  #info-body .counts span:nth-child(odd) { color: var(--muted); }
  #info-body .counts span:nth-child(even) { font-variant-numeric: tabular-nums; text-align: right; }
  button.tag { border: 1px solid transparent; font: inherit; font-size: 12px; cursor: pointer; }
  button.tag:hover { border-color: var(--accent); }
  button.tag.on { background: var(--accent); color: var(--accent-text); }
  .tag { display: inline-block; background: var(--accent-soft); color: var(--accent); border-radius: 6px; padding: 0 6px; font-size: 12px; margin: 1px 2px 1px 0; }
  .maplibregl-popup-content { background: var(--panel); color: var(--text); border-radius: 10px; padding: 12px 14px; box-shadow: var(--shadow); font: 13px/1.4 system-ui, sans-serif; max-width: 300px; }
  .maplibregl-popup-tip { border-top-color: var(--panel) !important; border-bottom-color: var(--panel) !important; }
  .maplibregl-popup-close-button { color: var(--muted); font-size: 18px; padding: 0 6px; }
  .pop h3 { margin: 0 18px 2px 0; font-size: 15px; }
  .pop .cat { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
  .pop table { border-collapse: collapse; width: 100%; }
  .pop td { padding: 2px 0; vertical-align: top; }
  .pop td:first-child { color: var(--muted); padding-right: 10px; white-space: nowrap; }
  .pop a { color: var(--accent); word-break: break-all; }
  @media (max-width: 720px) {
    body { flex-direction: column-reverse; }
    #side { width: 100%; height: 42%; border-right: 0; border-top: 1px solid var(--line); }
    #side header { padding: 10px 16px; }
  }
</style>
</head>
<body>
<aside id="side">
  <header>
    <div class="titles">
      <h1 id="venue-name">IMDF Viewer</h1>
      <div id="venue-sub">Open een IMDF-archief (.zip) of de losse .geojson-bestanden</div>
    </div>
    <div class="controls">
    <select id="lang" class="hidden" title="Taal van namen" aria-label="Taal van namen"></select>
    <div id="theme" role="group" aria-label="Thema">
      <button data-pref="auto" title="Automatisch (systeem)" aria-label="Automatisch"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm0 2v16a8 8 0 0 1 0-16Z"/></svg></button>
      <button data-pref="light" title="Licht" aria-label="Licht"><svg viewBox="0 0 24 24"><path d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10ZM11 1h2v3h-2zm0 19h2v3h-2zM1 11h3v2H1zm19 0h3v2h-3zM4.22 5.64l1.42-1.42 2.12 2.12-1.42 1.42zm12.02 12.02 1.42-1.42 2.12 2.12-1.42 1.42zM4.22 18.36l2.12-2.12 1.42 1.42-2.12 2.12zM16.24 6.34l2.12-2.12 1.42 1.42-2.12 2.12z"/></svg></button>
      <button data-pref="dark" title="Donker" aria-label="Donker"><svg viewBox="0 0 24 24"><path d="M21 14.5A9 9 0 0 1 9.5 3a9 9 0 1 0 11.5 11.5Z"/></svg></button>
    </div>
    </div>
  </header>
  <div class="scroll">
    <div class="row" style="margin-top:8px">
      <button class="btn" id="open-btn">Ander bestand openen…</button>
      <button class="btn hidden" id="close-btn" title="Bestand sluiten en niet meer onthouden">Sluiten</button>
    </div>

    <details id="info" class="hidden" open>
      <summary><h2>Bestand</h2></summary>
      <div id="info-body"></div>
    </details>

    <h2>Zoeken</h2>
    <input type="search" id="search" placeholder="Zoek occupant of amenity…" autocomplete="off">
    <div id="results"></div>

    <h2>Lagen</h2>
    <label class="chk"><input type="checkbox" data-layer="occupant" checked><span id="occupant-legend-icon"></span>Occupants<span class="cnt" id="cnt-occupant"></span></label>
    <label class="chk"><input type="checkbox" data-layer="amenity" checked><span id="amenity-legend-icon"></span>Amenities<span class="cnt" id="cnt-amenity"></span></label>
    <label class="chk"><input type="checkbox" data-layer="labels" checked>Namen tonen</label>
    <label class="chk" data-feat="venue"><input type="checkbox" data-layer="venue" checked>Venue<span class="cnt" data-cnt="venue"></span></label>
    <label class="chk" data-feat="footprint"><input type="checkbox" data-layer="footprint" checked>Footprints<span class="cnt" data-cnt="footprint"></span></label>
    <label class="chk" data-feat="level"><input type="checkbox" data-layer="level" checked>Levels<span class="cnt" data-cnt="level"></span></label>
    <label class="chk" data-feat="unit"><input type="checkbox" data-layer="unit" checked>Units<span class="cnt" data-cnt="unit"></span></label>
    <label class="chk" data-feat="opening"><input type="checkbox" data-layer="opening" checked>Openings<span class="cnt" data-cnt="opening"></span></label>
    <label class="chk" data-feat="section"><input type="checkbox" data-layer="section" checked>Sections<span class="cnt" data-cnt="section"></span></label>
    <label class="chk" data-feat="fixture"><input type="checkbox" data-layer="fixture" checked>Fixtures<span class="cnt" data-cnt="fixture"></span></label>
    <label class="chk" data-feat="kiosk"><input type="checkbox" data-layer="kiosk" checked>Kiosks<span class="cnt" data-cnt="kiosk"></span></label>
    <label class="chk" data-feat="detail"><input type="checkbox" data-layer="detail" checked>Details<span class="cnt" data-cnt="detail"></span></label>
    <label class="chk"><input type="checkbox" data-layer="basemap" checked>Achtergrondkaart</label>

    <h2>Categorieën op deze verdieping</h2>
    <details class="cats" open><summary>Occupants</summary><div class="list" id="cats-occupant"></div></details>
    <details class="cats"><summary>Amenities</summary><div class="list" id="cats-amenity"></div></details>
  </div>
</aside>

<div id="mapwrap">
  <div id="map"></div>
  <div id="levelname" class="hidden"></div>
  <div id="levels" class="hidden"></div>
  <div id="drop">
    <div class="box">
      <h1 style="margin:0;font-size:20px">IMDF-bestand openen</h1>
      <p>Sleep een IMDF .zip (of alle .geojson-bestanden) hierheen, of kies een bestand.</p>
      <button class="btn primary" id="pick-btn">Bestand kiezen…</button>
      <div id="status"></div>
    </div>
  </div>
</div>
<input type="file" id="file" accept=".zip,.geojson,.json" multiple class="hidden">

<script>
"use strict";
// ---------- Styling per category ----------
// Kaartpaletten per thema. Koele, rustige neutralen; functie-ruimtes krijgen een zachte tint
// (verticaal transport = blauw, sanitair = lavendel, verblijf = zand, groen = salie).
const PALETTE = {
  light: {
    bg: "#e9edf2", venueFill: "#ffffff", venueLine: "#4c5fd5", levelFill: "#fbfcfd", levelLine: "#8a95a5",
    line: "#c3cbd6", detail: "#a3adbb", opening: "#fbfcfd", text: "#1d2330", halo: "#ffffff",
    unitOpacity: 1, sectionGlow: 0.32, fixtureOpacity: 1, kiosk: "#c9d1dc",
    raster: { opacity: 0.6, sat: 0, min: 0, max: 1 },
    unit: { walkway: "#fbfcfd", room: "#eef1f6", nonpublic: "#e1e5eb", structure: "#c5ccd6", unspecified: "#f1f3f7",
      glass: "#d9eef5", brick: "#e7d6ca", stairs: "#dde5ff", escalator: "#dde5ff", elevator: "#d0dbff",
      movingwalkway: "#e4eaff", ramp: "#e4eaff", restroom: "#ece5fb", lounge: "#f6eddc", parking: "#e6e9ee",
      platform: "#e8e2d6", terrace: "#e2efe1", road: "#d9dde3", opentobelow: "rgba(0,0,0,0)" },
    // Section-kleuren: alleen de rand + een zachte gloed naar binnen, het midden blijft transparant
    section: { seating: "#b98545", security: "#e03e52", presecurity: "#f08c3c", postsecurity: "#1b9aaa", walkway: "#7f95ae",
      vegetation: "#4fa64a", parking: "#5f6fd1", road: "#87909c", baggageclaim: "#2f86d6", platform: "#a5794f",
      gate: "#e0a800", service: "#ae3ec9", retail: "#e64980", leisure: "#7c5cdb", _: "#94a0b0" },
    fixture: { furniture: "#d5dbe4", "checkin.desk": "#b9c6ec", desk: "#d0d6df", baggagecarousel: "#aebbd8", _: "#cdd4de" }
  },
  dark: {
    bg: "#0b0f15", venueFill: "#111720", venueLine: "#8d9bff", levelFill: "#121821", levelLine: "#556277",
    line: "#3a4659", detail: "#465367", opening: "#232c39", text: "#e7ebf2", halo: "#0b0f15",
    unitOpacity: 1, sectionGlow: 0.4, fixtureOpacity: 1, kiosk: "#36404f",
    raster: { opacity: 0.5, sat: -1, min: 0.8, max: 0.06 },   // min>max keert de grijze BRT-tegels om → donkere ondergrond
    unit: { walkway: "#232c39", room: "#2c3647", nonpublic: "#1d2530", structure: "#465266", unspecified: "#283241",
      glass: "#1d3641", brick: "#3a2e28", stairs: "#25305a", escalator: "#25305a", elevator: "#2b3870",
      movingwalkway: "#243050", ramp: "#243050", restroom: "#302a4c", lounge: "#382f22", parking: "#232a34",
      platform: "#332e26", terrace: "#1f3324", road: "#2a313b", opentobelow: "rgba(0,0,0,0)" },
    section: { seating: "#d6a566", security: "#ff6b7d", presecurity: "#ffa860", postsecurity: "#3cc6d4", walkway: "#8fa3bd",
      vegetation: "#73c46d", parking: "#8c9bff", road: "#7d8794", baggageclaim: "#5eaaf2", platform: "#c4986a",
      gate: "#ffd43b", service: "#da77f2", retail: "#f783ac", leisure: "#a28bff", _: "#8a96a8" },
    fixture: { furniture: "#333d4b", "checkin.desk": "#354679", desk: "#343e4c", baggagecarousel: "#3b4a72", _: "#323b48" }
  }
};
// Section-categorieën (OGC 20-094) → kleurgroep
const SECTION_GROUPS = [
  ["seating", /^seating/], ["security", /^security$/], ["presecurity", /^presecurity$/], ["postsecurity", /^(postsecurity|paidarea)$/],
  ["walkway", /^walkway$/], ["vegetation", /^vegetation$/], ["parking", /^(parking|parkandride|carrental)/], ["road", /^road$/],
  ["baggageclaim", /^baggageclaim/], ["platform", /^platform$/], ["gate", /^(gatearea|recomposearea)/],
  ["service", /^(checkin|ticketing|information|servicearea|immigration)/],
  ["retail", /^(retail|dutyfree|concessions|eatingdrinking|rental)/],
  ["leisure", /^(entertainmentarea|gambling|recreation|exhibit|arcade)/],
];
const sectionGroup = c => (SECTION_GROUPS.find(([, re]) => re.test(c || "")) || ["_"])[0];
// restroom.* erft de restroom-kleur
for (const p of Object.values(PALETTE)) for (const k of ["male", "female", "wheelchair", "family", "unisex", "transgender"]) p.unit["restroom." + k] = p.unit.restroom;

// Puntkleuren (gebaseerd op Open Color): helder genoeg voor beide thema's
const AMENITY_GROUPS = [
  { name: "Sanitair",  color: "#7950f2", test: c => /^(restroom|babychanging|shower|mothersroom|handsanitizerstation|caregiver)/.test(c) },
  { name: "Reizen",    color: "#1c7ed6", test: c => /^(boardinggate|arrivalgate|checkin|ticketing\.airline|security|baggage|immigration|customs|gatearea|paidarea|faregate)/.test(c) },
  { name: "Vervoer",   color: "#0c8599", test: c => /^(carrental|bus|taxi|parking|parkandride|traintrack|train|rail|transit|shuttle|limo|rideshare|valet|groundtransportation|peoplemover|platform|vendingmachine\.trainticket|ticketing|information\.transit)/.test(c) },
  { name: "Veiligheid",color: "#e03131", test: c => /^(defibrillator|firstaid|police|fire|emergencyshelter|healthscreening|mobilityrescue|phone\.emergency)/.test(c) },
  { name: "Service",   color: "#f08c00", test: c => true },
];
// Occupantgroepen volgens de IMDF-occupantcategorieën (OGC 20-094). Keukens (chinese, italian, …) vallen onder eten & drinken.
const FOOD_RE = new RegExp("^(" + [
  "restaurant","cafe","cafeteria","canteen","coffee","tea","bubbletea","juicebar","milkbar","milkshakes","bar","beerbar","beergarden","beerhall","pub","irishpub","gastropubs",
  "brewery","brewpub","distillery","cider","winebar","winery","winetasting","champagnebar","cocktailbar","loungebar","airportloungebar","hotelbar","pianobar","sportsbar","divebar",
  "tikibar","whiskeybar","sakebar","hookahbar","cigarbar","oxygenbar","food","foodcourt","foodstand","foodtruck","fastfood","kiosk\\.food","bakedgoods","bagels","bistro","buffet",
  "burgers","barbecue","barfood","breakfastandbrunch","cakes","cupcakes","customcakes","candy","chocolate","crepes","churros","chimneycakes","delicatessen","desserts","diner",
  "donuts","dumplings","falafel","fish","fishandchips","gelato","hotdogs","icecream","shavedice","shavedsnow","macaron","noodles","pasta","pizza","poke","pretzels","salad",
  "sandwiches","seafood","soup","steak","sushi","conveyorsushi","tacos","tapas","waffles","wok","wraps","kebab","donair","pita","flatbread","popcorn","potatoes","poutineries",

// ---------- Loading ----------
async function readZip(blob) {
  const zip = await JSZip.loadAsync(blob);
  const out = {};
  for (const [path, entry] of Object.entries(zip.files)) {
    if (entry.dir || path.startsWith("__MACOSX")) continue;
    const base = path.split("/").pop();
    if (!/\.(geojson|json)$/i.test(base)) continue;
    out[base.toLowerCase()] = await entry.async("string");
  }
  return out;
}
async function loadFiles(fileList) {
  setStatus("Bestanden lezen…");
  let raw = {};
  for (const f of fileList) {
    if (/\.zip$/i.test(f.name)) Object.assign(raw, await readZip(f));
    else raw[f.name.toLowerCase()] = await f.text();
  }
  await ingest(raw, fileList.length === 1 ? fileList[0].name : `${fileList.length} bestanden`);
}
function setStatus(t) { $("status").textContent = t; }

async function ingest(raw, label) {
  const parse = name => {
    const txt = raw[name + ".geojson"] ?? raw[name + ".json"];
    if (txt == null) return null;
    return JSON.parse(txt.replace(/^﻿/, ""));
  };
  const d = {};
  for (const t of ["manifest", "venue", "address", "building", "footprint", "level", "unit", "opening", "fixture",
                   "section", "detail", "kiosk", "geofence", "amenity", "anchor", "occupant", "relationship"]) {
    try { d[t] = parse(t); } catch (e) { throw new Error(`${t}.geojson is geen geldige JSON: ${e.message}`); }
  }
  try { d.metadata = parse("metadata"); } catch { d.metadata = null; }
  if (!d.level || !d.unit) throw new Error("Geen level.geojson / unit.geojson gevonden — is dit een IMDF-archief?");
  S.data = d;
  let saved = null; try { saved = localStorage.getItem("imdf-lang"); } catch {}
  S.lang = saved || d.manifest?.language || "nl";
  build();
  await mapReady;
  render();
  $("drop").classList.add("hidden");
  $("venue-sub").textContent = label;
  S.loaded = true;
}

// ---------- Build model ----------
function feats(t) { return S.data[t]?.features || []; }
function build() {
  S.levelById = {}; S.unitById = {}; S.anchorById = {}; S.featById = {}; S.levelsByOrd = new Map();
  for (const l of feats("level")) {
    S.levelById[l.id] = l; S.featById[l.id] = l;
    const o = l.properties.ordinal;
    if (!S.levelsByOrd.has(o)) S.levelsByOrd.set(o, []);
    S.levelsByOrd.get(o).push(l);
  }
  S.ordinals = [...S.levelsByOrd.keys()].sort((a, b) => b - a);
  const ordOf = lid => S.levelById[lid]?.properties.ordinal;
  const tag = (t, f) => { f.properties._ord = ordOf(f.properties.level_id); f.properties._fid = f.id; f.properties._type = t; S.featById[f.id] = f; };
  for (const t of ["unit", "fixture", "section", "detail", "opening", "kiosk", "geofence"]) for (const f of feats(t)) tag(t, f);
  for (const l of feats("level")) { l.properties._ord = l.properties.ordinal; l.properties._fid = l.id; l.properties._type = "level"; }
  for (const f of feats("section")) f.properties._sg = sectionGroup(f.properties.category);
  for (const u of feats("unit")) S.unitById[u.id] = u;
  for (const a of feats("anchor")) S.anchorById[a.id] = a;

  // Amenities: point geometry, level via referenced units
  S.points.amenity = [];
  for (const a of feats("amenity")) {
    const p = a.properties;
    const units = (p.unit_ids || []).map(id => S.unitById[id]).filter(Boolean);
    const ords = [...new Set(units.map(u => u.properties._ord).filter(o => o != null))];
    const geom = a.geometry || units[0]?.properties.display_point;
    if (!geom || !ords.length) continue;
    S.featById[a.id] = a;
    S.points.amenity.push({ type: "Feature", geometry: geom, properties: {
      _fid: a.id, _type: "amenity", _ok: "|" + ords.join("|") + "|", _ords: ords, category: p.category || "unspecified",
      _name: nm(p.name) || prettyCat(p.category), _color: groupColor(AMENITY_GROUPS, p.category),
      _icon: "am-" + (p.category || "unspecified") } });
  }
  // Occupants: geometry null; location from anchor → unit → level
  S.points.occupant = [];
  for (const o of feats("occupant")) {
    const p = o.properties, an = S.anchorById[p.anchor_id];
    if (!an?.geometry) continue;
    const unit = S.unitById[an.properties.unit_id];
    const ord = unit?.properties._ord;
    if (ord == null) continue;
    S.featById[o.id] = o;
    S.points.occupant.push({ type: "Feature", geometry: an.geometry, properties: {
      _fid: o.id, _type: "occupant", _ok: "|" + ord + "|", _ords: [ord], category: p.category || "unspecified",
      _name: nm(p.name) || "Occupant", _color: groupColor(OCC_GROUPS, p.category),
      _icon: "oc-" + (p.category || "unspecified") } });
  }
  renderInfo();
  const v = feats("venue")[0];
  $("venue-name").textContent = nm(v?.properties.name) || "IMDF Viewer";
  document.title = (nm(v?.properties.name) || "IMDF") + " · IMDF Viewer";
  S.ord = S.ordinals.includes(0) ? 0 : S.ordinals[S.ordinals.length - 1];
}

// ---------- Bestandsinformatie (manifest, metadata, venue, inhoud) ----------
function renderInfo() {
  const d = S.data, m = d.manifest || {}, v = feats("venue")[0]?.properties || {};
  const adr = feats("address").find(a => a.id === v.address_id)?.properties || feats("address")[0]?.properties;
  const table = pairs => "<table>" + pairs.filter(([, x]) => x != null && x !== "")
    .map(([k, x]) => `<tr><td>${esc(k)}</td><td>${x}</td></tr>`).join("") + "</table>";

    ["Telefoon", val(v.phone)], ["Website", v.website ? `<a href="${esc(v.website)}" target="_blank" rel="noopener">${esc(v.website.replace(/^https?:\/\//, ""))}</a>` : null],
    ["Namen in", langs.size ? [...langs].sort().map(l => `<button class="tag lang-tag${l === S.lang ? " on" : ""}" data-lang="${esc(l)}" title="Namen in ${esc(l)} tonen">${esc(l)}</button>`).join("") : null]]);
  const types = ["building", "footprint", "level", "unit", "opening", "section", "fixture", "detail", "kiosk", "geofence", "anchor", "occupant", "amenity", "relationship"];

// ---------- Render ----------
const fc = features => ({ type: "FeatureCollection", features });
function matchColor(table, fallback, prop = "category") {
  const m = ["match", ["get", prop]];
  for (const [k, v] of Object.entries(table)) m.push(k, v);
  m.push(fallback); return m;
}
const LAYERS = [];
function addLayer(def, group) { map.addLayer(def); LAYERS.push({ id: def.id, group }); }

// Zoombanden: onder zoom 15 geen punten; tot zoom 18 worden gelijke punten geclusterd (cz = zoom waarop de afstand berekend wordt)
const POINTS_MINZOOM = 15;
const CLUSTER_BANDS = [{ min: POINTS_MINZOOM, max: 16, cz: 15 }, { min: 16, max: 17, cz: 16 }, { min: 17, max: 18, cz: 17 }, { min: 18 }];
const layersOf = (t, kind) => LAYERS.filter(l => l.id.startsWith(`${t}-${kind}-`)).map(l => l.id);
const bandPoints = (t, b) => b.cz == null ? S.points[t].map(f => ({ ...f, properties: { ...f.properties, _count: 1 } })) : clusterPoints(S.points[t], b.cz);
function clusterPoints(points, z) {
  // Wereldpixels (512px-tegels) op zoom z
  const W = 512 * 2 ** z;
  const px = ([lng, lat]) => { const s = Math.sin(lat * Math.PI / 180);
    return [(lng + 180) / 360 * W, (0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI)) * W]; };
  const iconPx = 26 * (z <= 14 ? 0.4 : z >= 17 ? 0.75 : 0.4 + (z - 14) / 3 * 0.35);
  const R = Math.max(18, iconPx * 2.2), R2 = R * R;
  const groups = new Map();   // zelfde categorie én zelfde verdieping(en)
  for (const f of points) { const k = f.properties.category + f.properties._ok; (groups.get(k) || groups.set(k, []).get(k)).push(f); }
  const out = [];
  for (const g of groups.values()) {
    const P = g.map(f => px(f.geometry.coordinates)), used = new Uint8Array(g.length);
    for (let i = 0; i < g.length; i++) {
      if (used[i]) continue;
      used[i] = 1; const members = [i];
      // Groei het cluster vanuit alle leden (zodat een rij balies één cluster wordt)
      for (let m = 0; m < members.length; m++) for (let j = 0; j < g.length; j++) {
        if (used[j]) continue;
        const dx = P[members[m]][0] - P[j][0], dy = P[members[m]][1] - P[j][1];
        if (dx * dx + dy * dy <= R2) { used[j] = 1; members.push(j); }
      }
      const cs = members.map(k => g[k].geometry.coordinates);
      const lng = cs.reduce((a, c) => a + c[0], 0) / cs.length, lat = cs.reduce((a, c) => a + c[1], 0) / cs.length;
      const bbox = [Math.min(...cs.map(c => c[0])), Math.min(...cs.map(c => c[1])), Math.max(...cs.map(c => c[0])), Math.max(...cs.map(c => c[1]))];
      out.push({ type: "Feature", geometry: { type: "Point", coordinates: [lng, lat] },
        properties: { ...g[i].properties, _count: members.length, _bbox: JSON.stringify(bbox) } });
    }
  }
  return out;
}

// Zet de ringrichting vast (buitenring tegen de klok in, gaten met de klok mee),
// zodat een positieve line-offset altijd naar binnen wijst
function rewind(features) {
  const area = r => { let a = 0; for (let i = 0; i < r.length - 1; i++) a += r[i][0] * r[i + 1][1] - r[i + 1][0] * r[i][1]; return a; };
  const fix = (r, ccw) => (area(r) > 0) === ccw ? r : [...r].reverse();
  const poly = rings => rings.map((r, i) => fix(r, i === 0));
  return features.map(f => {
    const g = f.geometry; if (!g) return f;
    if (g.type === "Polygon") return { ...f, geometry: { type: "Polygon", coordinates: poly(g.coordinates) } };
    if (g.type === "MultiPolygon") return { ...f, geometry: { type: "MultiPolygon", coordinates: g.coordinates.map(poly) } };
    return f;
  });
}

function render() {
  for (const l of LAYERS.splice(0)) if (map.getLayer(l.id)) map.removeLayer(l.id);
  for (const s of Object.keys(map.getStyle().sources)) if (s !== "basemap") map.removeSource(s);

  src("venue", feats("venue")); src("footprint", feats("footprint")); src("level", feats("level"));
  src("unit", feats("unit")); src("section", rewind(feats("section"))); src("fixture", feats("fixture"));
  src("detail", feats("detail")); src("opening", feats("opening")); src("kiosk", feats("kiosk"));

  addLayer({ id: "fixture-fill", type: "fill", source: "fixture", paint: {} }, "fixture");
  addLayer({ id: "fixture-line", type: "line", source: "fixture", paint: { "line-width": 0.4 } }, "fixture");
  addLayer({ id: "kiosk-fill", type: "fill", source: "kiosk", paint: {} }, "kiosk");
  addLayer({ id: "detail-line", type: "line", source: "detail", minzoom: 16, paint: { "line-width": 0.6 } }, "detail");
  addLayer({ id: "opening-line", type: "line", source: "opening", paint: { "line-width": 3 } }, "opening");

  for (const t of ["amenity", "occupant"]) for (const p of S.points[t]) {
    const id = p.properties._icon;
    if (!map.hasImage(id)) {
      const cv = iconCanvas(p.properties.category, t);
      map.addImage(id, cv.getContext("2d").getImageData(0, 0, cv.width, cv.height), { pixelRatio: ICON_RATIO });
    }
  }
  const band = b => ({ ...(b.min != null && { minzoom: b.min }), ...(b.max != null && { maxzoom: b.max }) });
  for (const t of ["occupant", "amenity"]) CLUSTER_BANDS.forEach((b, i) => addLayer({ id: `${t}-pt-${i}`, type: "symbol", source: `${t}-${i}`, ...band(b),
    layout: {
      "icon-image": ["get", "_icon"], "icon-allow-overlap": true, "icon-ignore-placement": true,
      "icon-size": ["interpolate", ["linear"], ["zoom"], 14, 0.4, 17, 0.75, 19, 1, 21, 1.25],
      // Aantal-badge rechtsboven bij een cluster
      "text-field": ["case", [">", ["get", "_count"], 1], ["to-string", ["get", "_count"]], ""],
      "text-font": ["Noto Sans Bold"], "text-size": ["interpolate", ["linear"], ["zoom"], 14, 8, 17, 10],
      "text-offset": [1.05, -0.95], "text-allow-overlap": true, "text-ignore-placement": true },
    paint: { "text-color": "#ffffff", "text-halo-color": ["get", "_color"], "text-halo-width": 2.5 } }, t));
  // Namen alleen bij losse punten
  const LABEL = { occupant: { minzoom: 17, size: 12 }, amenity: { minzoom: 19.5, size: 11 } };
  for (const t of ["occupant", "amenity"]) CLUSTER_BANDS.forEach((b, i) => {

      ...band({ min: Math.max(b.min ?? 0, LABEL[t].minzoom), max: b.max }), layout: {
        "text-field": ["get", "_name"], "text-font": ["Noto Sans Regular"], "text-size": LABEL[t].size, "text-offset": [0, 1.5],
        "text-anchor": "top", "text-max-width": 9, "text-optional": true },

  renderLevelButtons();
  setLevel(S.ord, false);
  document.querySelectorAll("[data-feat]").forEach(l => l.classList.toggle("hidden", !feats(l.dataset.feat).length));
  document.querySelectorAll("[data-cnt]").forEach(c => c.textContent = feats(c.dataset.cnt).length.toLocaleString("nl-NL"));
  applyVisibility();
  fitVenue();
  $("cnt-occupant").textContent = S.points.occupant.length;
  $("cnt-amenity").textContent = S.points.amenity.length;
}

function fitVenue() {
  const b = new maplibregl.LngLatBounds();
  const walk = c => typeof c[0] === "number" ? b.extend(c) : c.forEach(walk);
  const src = feats("venue").length ? feats("venue") : feats("level");
  src.forEach(f => f.geometry && walk(f.geometry.coordinates));
  if (!b.isEmpty()) map.fitBounds(b, { padding: 40, duration: 0 });
}

function renderLevelButtons() {
  const el = $("levels"); el.innerHTML = "";
  for (const o of S.ordinals) {
    const lvls = S.levelsByOrd.get(o);
    const main = lvls.find(l => !l.properties.outdoor) || lvls[0];
    const b = document.createElement("button");
    b.textContent = nm(main.properties.short_name) || String(o);
    b.title = nm(main.properties.name) || `Ordinal ${o}`;
    b.dataset.ord = o;
    b.onclick = () => setLevel(o);
    el.appendChild(b);
  }
  el.classList.toggle("hidden", !S.ordinals.length);
}

function levelFilter(extra) {
  const f = ["==", ["get", "_ord"], S.ord];
  return extra ? ["all", f, extra] : f;
}
function pointFilter(type) {
  const f = ["all", ["in", "|" + S.ord + "|", ["get", "_ok"]]];
  const hidden = [...S.hiddenCats[type]];
  if (hidden.length) f.push(["!", ["in", ["get", "category"], ["literal", hidden]]]);
  return f;
}
function applyPointFilter(t) {
  for (const id of layersOf(t, "pt")) map.setFilter(id, pointFilter(t));
  for (const id of layersOf(t, "lbl")) map.setFilter(id, ["all", pointFilter(t), ["==", ["get", "_count"], 1]]);
}
function setLevel(o, closePopups = true) {
  S.ord = o;
  for (const id of ["level-fill", "level-line", "unit-fill", "section-fill", "section-glow", "section-line", "fixture-fill", "fixture-line", "kiosk-fill", "detail-line", "opening-line"])
    map.setFilter(id, levelFilter());
  map.setFilter("unit-line", levelFilter(["!=", ["get", "category"], "opentobelow"]));
  map.setFilter("unit-otb", levelFilter(["==", ["get", "category"], "opentobelow"]));
  for (const t of ["amenity", "occupant"]) applyPointFilter(t);
  document.querySelectorAll("#levels button").forEach(b => b.classList.toggle("on", Number(b.dataset.ord) === o));
  const lvls = S.levelsByOrd.get(o) || [];
  const names = [...new Set(lvls.map(l => nm(l.properties.name)).filter(Boolean))];
  const short = nm((lvls.find(l => !l.properties.outdoor) || lvls[0])?.properties.short_name);
  $("levelname").textContent = (short ? short + " · " : "") + (names.join(" / ") || "Verdieping " + o);
  $("levelname").classList.remove("hidden");
  if (closePopups && popup) popup.remove();
  renderCategories();
  saveView();
}

function renderCategories() {
  for (const type of ["occupant", "amenity"]) {
    const counts = {};
    for (const p of S.points[type]) if (p.properties._ords.includes(S.ord)) counts[p.properties.category] = (counts[p.properties.category] || 0) + 1;
    const box = $("cats-" + type); box.innerHTML = "";
    const cats = Object.keys(counts).sort();
    if (!cats.length) { box.innerHTML = '<div style="color:var(--muted);padding:3px 0">Geen op deze verdieping</div>'; continue; }
    for (const c of cats) {
      const lab = document.createElement("label"); lab.className = "chk";
      const mark = iconImg(c, 16, type);
      lab.innerHTML = `<input type="checkbox" ${S.hiddenCats[type].has(c) ? "" : "checked"}>${mark}${esc(prettyCat(c))}<span class="cnt">${counts[c]}</span>`;
      lab.querySelector("input").onchange = e => {
        e.target.checked ? S.hiddenCats[type].delete(c) : S.hiddenCats[type].add(c);
        applyPointFilter(type);
      };
      box.appendChild(lab);
    }
  }
}

function applyVisibility() {
  const on = {};
  document.querySelectorAll("[data-layer]").forEach(i => on[i.dataset.layer] = i.checked);
  const set = (id, v) => map.getLayer(id) && map.setLayoutProperty(id, "visibility", v ? "visible" : "none");
  set("basemap", on.basemap);
  for (const l of LAYERS) {
    const g = l.group;
    const v = g === "occupant-lbl" ? on.occupant && on.labels : g === "amenity-lbl" ? on.amenity && on.labels :
      (g in on ? on[g] : true);
    set(l.id, v);
  }
}
try { const saved = JSON.parse(localStorage.getItem("imdf-layers") || "{}");
  document.querySelectorAll("[data-layer]").forEach(i => { if (i.dataset.layer in saved) i.checked = saved[i.dataset.layer]; }); } catch {}
document.querySelectorAll("[data-layer]").forEach(i => i.onchange = () => {
  const on = {}; document.querySelectorAll("[data-layer]").forEach(x => on[x.dataset.layer] = x.checked);
  try { localStorage.setItem("imdf-layers", JSON.stringify(on)); } catch {}
  applyVisibility();
});

// ---------- Popups ----------
let popup = null;
function levelLabel(ord) {
  const lv = (S.levelsByOrd.get(ord) || [])[0];
  return lv ? (nm(lv.properties.short_name) || "") + " " + (nm(lv.properties.name) || "") : String(ord);
}
function rows(pairs) {
  return "<table>" + pairs.filter(([, v]) => v != null && v !== "" && !(Array.isArray(v) && !v.length))
    .map(([k, v]) => `<tr><td>${esc(k)}</td><td>${v}</td></tr>`).join("") + "</table>";
}
function popupHtml(f) {
  const p = f.properties, t = f.feature_type;
  const link = u => u ? `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a>` : null;
  let unit = null, extra = [];
  if (t === "occupant") {
    const an = S.anchorById[p.anchor_id]; unit = an && S.unitById[an.properties.unit_id];
    if (p.validity) extra.push(["Geldig", esc([p.validity.start?.slice(0, 10), p.validity.end?.slice(0, 10) || "…"].join(" → "))]);
  } else if (t === "amenity") {
    unit = S.unitById[(p.unit_ids || [])[0]];
  } else if (p.level_id) {
    unit = null;
  }
  const lvl = S.levelById[(unit || f).properties.level_id];
  const title = nm(p.name) || prettyCat(p.category) || t;
  return `<div class="pop"><h3>${esc(title)}</h3><div class="cat">${esc(t)} · ${esc(prettyCat(p.category))}</div>` + rows([
    ["Alt. naam", esc(nm(p.alt_name))],
    ["Openingstijden", esc(p.hours)],
    ["Telefoon", esc(p.phone)],
    ["Website", link(p.website)],
    ["Toegankelijk", esc((p.accessibility || []).join(", "))],
    ["Restrictie", esc(p.restriction)],
    ...extra,
    ["Unit", unit ? esc(nm(unit.properties.name) || prettyCat(unit.properties.category)) : null],
    ["Verdieping", lvl ? esc(levelLabel(lvl.properties.ordinal) + (lvl.properties.outdoor ? " (buiten)" : "")) : null],
    ["ID", `<code style="font-size:11px">${esc(f.id)}</code>`]
  ]) + "</div>";
}
function showPopup(f, lngLat) {
  if (popup) popup.remove();
  popup = new maplibregl.Popup({ maxWidth: "320px", offset: 10 }).setLngLat(lngLat).setHTML(popupHtml(f)).addTo(map);
}
const clickable = () => [...layersOf("occupant", "pt"), ...layersOf("amenity", "pt"), ...layersOf("occupant", "lbl"), "fixture-fill", "section-fill", "unit-fill"];
map.on("click", e => {
  if (!S.loaded) return;
  const hits = map.queryRenderedFeatures(e.point, { layers: clickable().filter(id => map.getLayer(id)) });
  if (!hits.length) return;
  const h = hits[0];
  if (h.properties._count > 1) {   // cluster: inzoomen tot de losse punten zichtbaar zijn
    const [x1, y1, x2, y2] = JSON.parse(h.properties._bbox);
    const cam = map.cameraForBounds([[x1, y1], [x2, y2]], { padding: 80, maxZoom: 21 });
    map.easeTo({ center: cam.center, zoom: Math.max(cam.zoom, 18.2) });
    return;
  }
  const f = S.featById[h.properties._fid];
  if (!f) return;
  const at = h.geometry.type === "Point" ? h.geometry.coordinates : e.lngLat;
  showPopup(f, at);
});
map.on("mousemove", e => {
  if (!S.loaded) return;
  const hits = map.queryRenderedFeatures(e.point, { layers: [...layersOf("occupant", "pt"), ...layersOf("amenity", "pt")].filter(id => map.getLayer(id)) });
  map.getCanvas().style.cursor = hits.length ? "pointer" : "";
});

// ---------- Search ----------
$("search").oninput = () => {
  const q = $("search").value.trim().toLowerCase(), box = $("results");
  box.innerHTML = "";
  if (q.length < 2) return;
  const all = [...S.points.occupant, ...S.points.amenity]
    .filter(p => p.properties._name.toLowerCase().includes(q) || p.properties.category.includes(q)).slice(0, 60);
  if (!all.length) { box.innerHTML = '<div style="cursor:default;color:var(--muted)">Niets gevonden</div>'; return; }
  for (const p of all) {
    const d = document.createElement("div"), pr = p.properties;
    d.innerHTML = `${iconImg(pr.category, 16, pr._type)}${esc(pr._name)}<small>${esc(nm((S.levelsByOrd.get(pr._ords[0]) || [])[0]?.properties.short_name) || pr._ords[0])}</small>`;
    d.onclick = () => {
      setLevel(pr._ords[0]);
      map.flyTo({ center: p.geometry.coordinates, zoom: Math.max(map.getZoom(), 19) });
      map.once("moveend", () => showPopup(S.featById[pr._fid], p.geometry.coordinates));
    };
    box.appendChild(d);
  }
};

// ---------- File input / drag & drop ----------
const pick = () => $("file").click();
$("pick-btn").onclick = pick;
$("open-btn").onclick = pick;
$("close-btn").onclick = forget;
// ---------- Onthouden tussen verversingen (IndexedDB, blijft lokaal in deze browser) ----------
const idb = () => new Promise((res, rej) => {
  const r = indexedDB.open("imdf-viewer", 1);
  r.onupgradeneeded = () => r.result.createObjectStore("kv");
  r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
});
async function idbDo(mode, fn) {
  const db = await idb();
  return new Promise((res, rej) => {
    const tx = db.transaction("kv", mode), req = fn(tx.objectStore("kv"));
    tx.oncomplete = () => { db.close(); res(req?.result); }; tx.onerror = () => { db.close(); rej(tx.error); };
  });
}
const store = {
  get: k => idbDo("readonly", s => s.get(k)),
  set: (k, v) => idbDo("readwrite", s => s.put(v, k)),
  del: k => idbDo("readwrite", s => s.delete(k)),
};
// Kaartpositie en verdieping bewaren
function saveView() {
  if (!S.loaded) return;
  const c = map.getCenter();
  try { localStorage.setItem("imdf-view", JSON.stringify({ c: [c.lng, c.lat], z: map.getZoom(), b: map.getBearing(), p: map.getPitch(), o: S.ord })); } catch {}
}
map.on("moveend", saveView);
function restoreView() {
  let v; try { v = JSON.parse(localStorage.getItem("imdf-view")); } catch {}
  if (!v) return;
  if (S.ordinals.includes(v.o)) setLevel(v.o);
  map.jumpTo({ center: v.c, zoom: v.z, bearing: v.b, pitch: v.p });
}
async function forget() {
  try { await store.del("files"); localStorage.removeItem("imdf-view"); } catch {}
  location.href = location.pathname;
}

async function handle(fileList) {
  const files = [...fileList];   // direct kopiëren: het file-input wordt meteen daarna leeggemaakt
  if (!files.length) return;
  $("drop").classList.remove("hidden");
  try {
    await loadFiles(files);
    localStorage.removeItem("imdf-view");
    saveView();
    $("close-btn").classList.remove("hidden");
    try { await store.set("files", files); }
    catch (e) { console.warn("Kon bestand niet onthouden:", e); }
  }
  catch (e) { console.error(e); setStatus("Fout: " + e.message); }
}
$("file").onchange = e => { handle(e.target.files); e.target.value = ""; };
let dragDepth = 0;
window.addEventListener("dragenter", e => { e.preventDefault(); dragDepth++; $("drop").classList.remove("hidden"); $("drop").classList.add("over"); });
window.addEventListener("dragover", e => e.preventDefault());
window.addEventListener("dragleave", () => { if (--dragDepth <= 0) { dragDepth = 0; $("drop").classList.remove("over"); if (S.loaded) $("drop").classList.add("hidden"); } });
window.addEventListener("drop", e => { e.preventDefault(); dragDepth = 0; $("drop").classList.remove("over"); handle(e.dataTransfer.files); });
$("drop").addEventListener("click", e => { if (e.target === $("drop") && S.loaded) $("drop").classList.add("hidden"); });

// Optional: ?src=pad/naar/imdf.zip (werkt als de viewer via een webserver draait)
(async () => {
  const src = new URLSearchParams(location.search).get("src");
  if (!src) {
    // Geen ?src: het laatst geopende bestand herstellen
    let files; try { files = await store.get("files"); } catch {}
    if (!files?.length) return;
    try {
      setStatus("Vorig bestand herstellen…");
      await loadFiles(files);
      restoreView();
      $("close-btn").classList.remove("hidden");
    } catch (e) { console.error(e); setStatus("Kon vorig bestand niet herstellen: " + e.message); }
    return;
  }
  try {
    setStatus("Laden: " + src + "…");
    const res = await fetch(src); if (!res.ok) throw new Error(res.status + " " + res.statusText);
    await ingest(await readZip(await res.blob()), src.split("/").pop());
  } catch (e) { console.error(e); setStatus("Kon " + src + " niet laden: " + e.message); }
})();
</script>
</body>
